<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小汪記記 - 任務編輯</title>

    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            padding: 0;
        }

        /* 頂部導航欄 */
        .nav-bar {
            background-color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: #007AFF;
            cursor: pointer;
            padding: 8px;
            margin-right: 8px;
        }

        .nav-title {
            color: #8E8E93;
            font-size: 17px;
            font-weight: 600;
        }

        .nav-right {
            color: #8E8E93;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }

        /* 主內容區 */
        .main-content {
            background-color: white;
            margin: 20px 16px;
            border-radius: 12px;
            overflow: hidden;
        }

        /* 任務標題輸入 */
        .task-title-section {
            padding: 24px 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .task-title-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 24px;
            font-weight: 500;
            color: #000;
            background: transparent;
            padding: 0;
            line-height: 1.2;
        }

        .task-title-input::placeholder {
            color: #C7C7CC;
        }

        /* 設定項目列表 */
        .settings-list {
            padding: 0;
        }

        .setting-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-item:hover {
            background-color: #f8f8f8;
        }

        .setting-icon {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .setting-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-label {
            font-size: 16px;
            color: #000;
            font-weight: 400;
        }

        .setting-value {
            font-size: 16px;
            color: #8E8E93;
            margin-right: 8px;
        }

        .setting-arrow {
            color: #C7C7CC;
            font-size: 14px;
        }

        /* 備註區域 */
        .notes-section {
            margin: 20px 16px;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
        }

        .notes-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .notes-item:hover {
            background-color: #f8f8f8;
        }

        .notes-icon {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .notes-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .notes-label {
            font-size: 16px;
            color: #000;
            font-weight: 400;
        }

        .notes-value {
            font-size: 16px;
            color: #8E8E93;
            margin-right: 8px;
        }

        /* 載入和錯誤狀態 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background-color: white;
            margin: 20px 16px;
            border-radius: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #FF3B30;
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 16px;
            text-align: center;
        }

        /* 隱藏狀態 */
        .hidden {
            display: none;
        }

        /* 模態框樣式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: white;
            margin: 50% auto;
            padding: 0;
            border-radius: 14px;
            width: 90%;
            max-width: 300px;
            text-align: center;
        }

        .modal-title {
            padding: 20px 20px 10px 20px;
            font-size: 17px;
            font-weight: 600;
            color: #000;
        }

        .modal-message {
            padding: 0 20px 20px 20px;
            font-size: 13px;
            color: #8E8E93;
            line-height: 1.4;
        }

        .modal-buttons {
            border-top: 1px solid #e5e5e5;
            display: flex;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 17px;
            cursor: pointer;
        }

        .modal-btn:first-child {
            border-right: 1px solid #e5e5e5;
            color: #8E8E93;
        }

        .modal-btn:last-child {
            color: #007AFF;
            font-weight: 600;
        }

        /* 備註輸入模態框 */
        .note-modal .modal-content {
            margin: 30% auto;
            max-width: 350px;
        }

        .note-textarea {
            width: 100%;
            min-height: 120px;
            padding: 20px;
            border: none;
            outline: none;
            font-size: 16px;
            resize: none;
            background-color: #f8f8f8;
        }

        .note-textarea::placeholder {
            color: #C7C7CC;
        }
    </style>
</head>
<body>
    <!-- 導航欄 -->
    <div class="nav-bar">
        <div class="nav-left">
            <button class="back-btn" onclick="closeWindow()">‹</button>
            <span class="nav-title">沒有分類</span>
        </div>
        <div class="nav-right">⋯</div>
    </div>

    <!-- 載入中 -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>

    <!-- 錯誤訊息 -->
    <div id="error" class="error hidden"></div>

    <!-- 主內容 -->
    <div id="mainContent" class="hidden">
        <!-- 任務標題和備註 -->
        <div class="main-content">
            <div class="task-title-section">
                <input type="text"
                       id="taskTitle"
                       class="task-title-input"
                       placeholder="輸入任務標題"
                       maxlength="100">
            </div>

            <!-- 備註欄位 -->
            <div class="notes-item" onclick="showNoteEditor()">
                <div class="notes-icon">📝</div>
                <div class="notes-content">
                    <span class="notes-label">備註</span>
                    <div>
                        <span class="notes-value" id="taskNoteStatus">新增</span>
                        <span class="setting-arrow">›</span>
                    </div>
                </div>
            </div>

            <!-- 設定項目 -->
            <div class="settings-list">
                <div class="setting-item" onclick="showDatePicker()">
                    <div class="setting-icon">📅</div>
                    <div class="setting-content">
                        <span class="setting-label">預定日期</span>
                        <div>
                            <span class="setting-value" id="taskDate">2025/09/14</span>
                            <span class="setting-arrow">›</span>
                        </div>
                    </div>
                </div>

                <div class="setting-item" onclick="showTimePicker()">
                    <div class="setting-icon">🕐</div>
                    <div class="setting-content">
                        <span class="setting-label">時間</span>
                        <div>
                            <span class="setting-value" id="taskTime">否</span>
                            <span class="setting-arrow">›</span>
                        </div>
                    </div>
                </div>

                <div class="setting-item" onclick="showReminderPicker()">
                    <div class="setting-icon">🔔</div>
                    <div class="setting-content">
                        <span class="setting-label">提醒時間</span>
                        <div>
                            <span class="setting-value" id="taskReminder">否</span>
                            <span class="setting-arrow">›</span>
                        </div>
                    </div>
                </div>

                <div class="setting-item" onclick="showRepeatPicker()">
                    <div class="setting-icon">🔄</div>
                    <div class="setting-content">
                        <span class="setting-label">重複性任務</span>
                        <div>
                            <span class="setting-value" id="taskRepeat">否</span>
                            <span class="setting-arrow">›</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 備註編輯模態框 -->
    <div id="noteModal" class="modal note-modal">
        <div class="modal-content">
            <div class="modal-title">備註</div>
            <textarea id="noteTextarea"
                      class="note-textarea"
                      placeholder="輸入備註內容..."
                      maxlength="500"></textarea>
            <div class="modal-buttons">
                <button class="modal-btn" onclick="closeNoteModal()">取消</button>
                <button class="modal-btn" onclick="saveNote()">儲存</button>
            </div>
        </div>
    </div>

    <!-- 確認對話框 -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="confirmTitle">確認</div>
            <div class="modal-message" id="confirmMessage">確定要執行此操作嗎？</div>
            <div class="modal-buttons">
                <button class="modal-btn" onclick="closeConfirmModal()">取消</button>
                <button class="modal-btn" id="confirmBtn" onclick="confirmAction()">確定</button>
            </div>
        </div>
    </div>

    <script>
        let liffProfile = null;
        let currentTaskId = null;
        let currentTaskData = {
            text: '',
            date: new Date().toISOString().split('T')[0].replace(/-/g, '/'),
            time: null,
            reminder: null,
            repeat: null,
            note: ''
        };

        // 從 URL 參數取得任務資訊
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                taskId: params.get('taskId'),
                taskText: decodeURIComponent(params.get('taskText') || '')
            };
        }

        // LIFF 初始化
        async function initializeLiff() {
            try {
                console.log('🔧 [LIFF 初始化] 開始初始化 LIFF...');

                await liff.init({
                    liffId: '2008077335-rZlgE4bX'
                });

                console.log('✅ [LIFF 初始化] LIFF 初始化成功');

                if (liff.isLoggedIn()) {
                    console.log('✅ [使用者驗證] 使用者已登入');
                    liffProfile = await liff.getProfile();
                    await loadTaskData();
                } else {
                    console.log('❌ [使用者驗證] 使用者未登入，導向登入頁面');
                    liff.login();
                }
            } catch (error) {
                console.error('❌ [LIFF 初始化] 初始化失敗:', error);
                showError('LIFF 初始化失敗: ' + error.message);
            }
        }

        // 載入任務資料
        async function loadTaskData() {
            try {
                const params = getUrlParams();

                if (!params.taskId) {
                    showError('缺少任務 ID 參數');
                    return;
                }

                currentTaskId = params.taskId;
                currentTaskData.text = params.taskText;

                // 顯示任務標題
                document.getElementById('taskTitle').value = currentTaskData.text;

                // 載入現有備註
                try {
                    const response = await fetch(`/api/task-note/${currentTaskId}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-User-ID': liffProfile.userId
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.note && data.note.trim()) {
                            currentTaskData.note = data.note;
                            document.getElementById('taskNoteStatus').textContent = '已設定';
                            document.getElementById('taskNoteStatus').style.color = '#007AFF';
                        }
                    }
                } catch (noteError) {
                    console.log('備註載入失敗，使用預設值');
                }

                updateDateDisplay();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');

            } catch (error) {
                console.error('❌ [任務載入] 載入失敗:', error);
                showError('載入任務失敗: ' + error.message);
            }
        }

        // 更新日期顯示
        function updateDateDisplay() {
            const today = new Date();
            const dateStr = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
            document.getElementById('taskDate').textContent = dateStr;
        }

        // 顯示日期選擇器
        function showDatePicker() {
            showAlert('日期設定', '日期選擇功能開發中');
        }

        // 顯示時間選擇器
        function showTimePicker() {
            showAlert('時間設定', '時間選擇功能開發中');
        }

        // 顯示提醒選擇器
        function showReminderPicker() {
            showAlert('提醒設定', '提醒功能開發中');
        }

        // 顯示重複選擇器
        function showRepeatPicker() {
            showAlert('重複設定', '重複任務功能開發中');
        }

        // 顯示備註編輯器
        function showNoteEditor() {
            document.getElementById('noteTextarea').value = currentTaskData.note;
            document.getElementById('noteModal').style.display = 'block';
        }

        // 關閉備註模態框
        function closeNoteModal() {
            document.getElementById('noteModal').style.display = 'none';
        }

        // 儲存備註
        async function saveNote() {
            try {
                const noteText = document.getElementById('noteTextarea').value.trim();

                const response = await fetch('/api/task-note', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': liffProfile.userId
                    },
                    body: JSON.stringify({
                        taskId: currentTaskId,
                        taskText: currentTaskData.text,
                        note: noteText
                    })
                });

                if (response.ok) {
                    currentTaskData.note = noteText;

                    // 更新備註狀態顯示
                    const noteStatus = document.getElementById('taskNoteStatus');
                    if (noteText) {
                        noteStatus.textContent = '已設定';
                        noteStatus.style.color = '#007AFF';
                    } else {
                        noteStatus.textContent = '新增';
                        noteStatus.style.color = '#8E8E93';
                    }

                    closeNoteModal();
                    showAlert('儲存成功', '備註已成功儲存！');
                } else {
                    const error = await response.text();
                    showAlert('儲存失敗', error);
                }

            } catch (error) {
                console.error('❌ [儲存備註] 儲存失敗:', error);
                showAlert('儲存失敗', '儲存備註失敗: ' + error.message);
            }
        }

        // 顯示提示訊息
        function showAlert(title, message) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmBtn').textContent = '確定';
            document.getElementById('confirmBtn').onclick = closeConfirmModal;
            document.getElementById('confirmModal').style.display = 'block';
        }

        // 關閉確認模態框
        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        // 確認操作
        function confirmAction() {
            closeConfirmModal();
        }

        // 顯示錯誤訊息
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            document.getElementById('loading').classList.add('hidden');
        }

        // 關閉視窗
        function closeWindow() {
            if (liff) {
                liff.closeWindow();
            } else {
                window.close();
            }
        }

        // 點擊模態框背景關閉
        window.onclick = function(event) {
            const noteModal = document.getElementById('noteModal');
            const confirmModal = document.getElementById('confirmModal');

            if (event.target == noteModal) {
                closeNoteModal();
            }
            if (event.target == confirmModal) {
                closeConfirmModal();
            }
        }

        // 自動儲存任務標題
        document.addEventListener('DOMContentLoaded', function() {
            const titleInput = document.getElementById('taskTitle');
            let saveTimeout;

            titleInput.addEventListener('input', function() {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(async () => {
                    const newTitle = titleInput.value.trim();
                    if (newTitle && newTitle !== currentTaskData.text) {
                        // 這裡可以加入自動儲存邏輯
                        currentTaskData.text = newTitle;
                        console.log('任務標題已更新:', newTitle);
                    }
                }, 1000);
            });
        });

        // 頁面載入時初始化 LIFF
        window.addEventListener('load', initializeLiff);
    </script>
</body>
</html>
